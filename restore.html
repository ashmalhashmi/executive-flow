<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="robots" content="noindex" />
    <title>Executive Flow — Emergency Restore</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #09090b;
        color: #f4f4f5;
        padding: 1.25rem;
        padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
        line-height: 1.5;
      }
      .card {
        max-width: 28rem;
        margin: 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 1.25rem;
        background: rgba(255, 255, 255, 0.04);
      }
      h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
      p { margin: 0.5rem 0; font-size: 0.9rem; color: #a1a1aa; }
      .ok { color: #86efac; }
      .warn { color: #fcd34d; }
      .err { color: #fca5a5; }
      label { display: block; font-size: 0.75rem; color: #a1a1aa; margin-top: 0.75rem; }
      input {
        width: 100%;
        margin-top: 0.35rem;
        padding: 0.65rem 0.75rem;
        border-radius: 0.65rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #18181b;
        color: #fff;
        font-size: 1rem;
      }
      button {
        width: 100%;
        margin-top: 0.75rem;
        padding: 0.75rem 1rem;
        border: none;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .primary { background: #6366f1; color: #fff; }
      .secondary { background: #27272a; color: #e4e4e7; }
      .ghost { background: transparent; border: 1px solid rgba(255,255,255,.15); color: #d4d4d8; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      #log {
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 0.65rem;
        background: #18181b;
        font-size: 0.8rem;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 2.5rem;
      }
      .badge {
        display: inline-block;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #818cf8;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Data safe · No Clear site data</div>
      <h1>Emergency Restore</h1>
      <p>
        App load nahi ho rahi? Yahan se <strong class="ok">cloud backup</strong> is device par lao.
        Sirf cache saaf hoti hai — <strong>Clear site data mat karein</strong>.
      </p>

      <button type="button" class="secondary" id="btn-cache">Step 1 — Fix cache (safe)</button>

      <label for="email">Step 2 — Email (Sync wali)</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />

      <button type="button" class="primary" id="btn-send">Send login code</button>

      <label for="otp">Email ka 6–8 digit code</label>
      <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" />

      <button type="button" class="primary" id="btn-verify">Verify &amp; login</button>

      <button type="button" class="primary" id="btn-load" disabled>Step 3 — Load my data from cloud</button>

      <button type="button" class="ghost" id="btn-open">Open Executive Flow app</button>

      <div id="log">Loading…</div>
    </div>
    <script type="module" src="/src/restore/main.js"></script>
  </body>
</html>
