<!DOCTYPE html>
<html>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #18181b;">
    <h2 style="margin: 0 0 12px;">Executive Flow — Login Code</h2>
    <p style="margin: 0 0 8px;">Aapka <strong>6–8 digit login code</strong>:</p>
    <p
      style="
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.25em;
        margin: 16px 0;
        color: #4f46e5;
      "
    >
      {{ .Token }}
    </p>
    <p style="margin: 0 0 12px; color: #52525b;">
      Yeh code mobile / laptop app ke <strong>Sync &amp; Backup</strong> page par type karein.
    </p>
    <hr style="border: none; border-top: 1px solid #e4e4e7; margin: 20px 0;" />
    <p style="margin: 0 0 8px; color: #71717a; font-size: 13px;">
      Optional: agar code type nahi karna, neeche link Chrome mein kholo:
    </p>
    <p style="margin: 0;">
      <a href="{{ .ConfirmationURL }}" style="color: #4f46e5;">Log in with link</a>
    </p>
    <p style="margin: 16px 0 0; color: #a1a1aa; font-size: 12px;">
      Agar aapne ye request nahi ki, is email ko ignore karein.
    </p>
  </body>
</html>
